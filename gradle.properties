# ==============================================================================
# AnimeBridge Gradle Properties - Low-Memory / Low-Power Laptop Profile
# Hardware Target: Windows 11 (8 GB RAM, AMD Integrated GPU, Low-Power CPU)
# ==============================================================================

# 1. Conservative JVM Memory Settings (768 MB max heap with Serial GC)
# Serial GC reduces JVM memory overhead and context switching on low-power CPUs.
org.gradle.jvmargs=-Xmx768m -XX:+UseSerialGC -XX:SoftRefLRUPolicyMSPerMB=50 -Dfile.encoding=UTF-8

# 2. Kotlin Compiler Daemon Constraints
kotlin.daemon.jvmargs=-Xmx512m -XX:+UseSerialGC
kotlin.incremental=true

# 3. Worker Concurrency & Parallelism Limits
# Limit strictly to 1 worker to prevent RAM exhaustion and CPU throttling.
org.gradle.parallel=false
org.gradle.workers.max=1

# 4. Cache & Incremental Build Optimization
org.gradle.caching=true
org.gradle.configuration-cache=false

# 5. Background Process Management
# Disable continuous file system watcher background thread to save RAM
org.gradle.vfs.watch=false

# Auto-terminate idle Gradle daemon after 60 seconds to release memory back to Windows
org.gradle.daemon.idletimeout=60000

# 6. Android Gradle Plugin Settings
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
